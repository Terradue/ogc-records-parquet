site_name: OG API Records - Parquet
site_description: Store and recover OGC Records with Arrow and GeoParquet.
site_url: https://Terradue.github.io/ogc-records-parquet/
repo_url: https://github.com/Terradue/ogc-records-parquet

strict: true
docs_dir: docs
site_dir: site

theme:
  name: readthedocs

nav:
  - Home: index.md
  - Tutorials:
      - Your first round trip: tutorials/first-round-trip.md
  - How-to guides:
      - Import and export records: how-to/import-export.md
      - Project and filter records: how-to/project-filter.md
      - Store collection membership: how-to/collections.md
      - Migrate existing applications and files: how-to/migrate.md
      - Develop and build documentation: how-to/develop.md
  - Reference:
      - Python API: reference/api.md
      - Command-line interface: reference/cli.md
      - Storage format: reference/storage-format.md
      - Errors and limitations: reference/limitations.md
  - Explanation:
      - Preservation and projections: explanation/preservation.md
      - OGC Records and STAC: explanation/ogc-and-stac.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true

markdown_extensions:
  - admonition
  - toc:
      permalink: true

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
